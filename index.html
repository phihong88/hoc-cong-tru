<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bé Học Cộng Trừ</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f5ff;--ink:#1b2d4f;--cd:#fff;--cell:#eaf3ff;--b:#2f80ed;--g:#22a559;--o:#ff9f1c;--p:#e8508a;--r:#e63946;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10203a;--ink:#f1f6ff;--cd:#1c3257;--cell:#27406b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.3 'Baloo 2','Comic Sans MS',system-ui,sans-serif;text-align:center}
button{font:inherit;color:inherit;cursor:pointer;border:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--b);display:flex;gap:6px;padding:8px;justify-content:center;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--b);z-index:6}
#nav{display:flex;gap:6px;flex:1;max-width:760px}
.tab{flex:1;min-height:56px;border-radius:16px;background:#ffffff33;color:#fff;font-size:clamp(13px,3.4vw,19px);padding:4px}
.tab.on{background:#fff;color:var(--b);font-weight:800}
#snd{width:56px;height:56px;border-radius:50%;background:#fff;font-size:26px}
main{max-width:820px;margin:0 auto;padding:14px 12px 40px}
.seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.pill{min-height:52px;padding:6px 18px;border-radius:26px;background:var(--cd);border:3px solid var(--b);font-size:19px}
.pill.on{background:var(--b);color:#fff}
.btn{min-height:60px;padding:8px 26px;border-radius:30px;background:var(--g);color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 #17703b;margin:8px 6px}
.card2{background:var(--cd);border-radius:24px;padding:14px;margin-bottom:12px}
.steps{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.stp{display:flex;align-items:center;gap:8px}.num{font-size:48px;font-weight:800;min-width:60px}
.sb{width:60px;height:60px;border-radius:50%;background:var(--o);color:#fff;font-size:32px;font-weight:800}
.big{font-size:48px}
.scene{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:12px 0;min-height:60px}
.grp{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.plus{font-size:40px;font-weight:800;color:var(--o)}
.tf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--cd);border:3px solid var(--b);border-radius:14px;padding:5px;width:260px;max-width:100%}
.cell{aspect-ratio:1;display:grid;place-items:center;background:var(--cell);border-radius:8px;font-size:clamp(22px,7vw,38px)}
.it{font-style:normal;display:inline-block;position:relative;font-size:clamp(26px,7vw,40px)}.cell .it{font-size:inherit}
.x{opacity:.3;filter:grayscale(1);transition:.5s}.x::after{content:"✖";position:absolute;inset:0;color:var(--r);font-size:.9em;opacity:1;filter:none}
.pop{animation:pop .7s}.fly{animation:fly .6s backwards}
@keyframes pop{0%{transform:scale(.2) translateY(-40px)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes fly{from{transform:translateY(-90px) scale(.2);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.eq{font-size:clamp(36px,10vw,64px);font-weight:800;margin:6px 0;min-height:1.2em}
.tgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tc{min-width:120px;min-height:64px;padding:8px 12px;border-radius:18px;color:#fff;font-size:24px;font-weight:800}
.c0{background:#2f80ed}.c1{background:#22a559}.c2{background:#ff9f1c}.c3{background:#e8508a}.c4{background:#8e5bd6}.c5{background:#14a5b8}
#pop{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:14px}
#pop.show{display:grid}#pop>div{background:var(--cd);border-radius:28px;padding:18px;max-width:520px;width:100%;max-height:92vh;overflow:auto}
.prog{height:22px;border-radius:12px;background:var(--cell);overflow:hidden;margin:4px 0 10px}.prog i{display:block;height:100%;background:var(--o);border-radius:12px;transition:width .4s}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.ac{min-height:90px;border-radius:22px;background:var(--cd);border:4px solid var(--b);font-size:44px;font-weight:800}
.ok{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}.bad{opacity:.4;border-color:var(--r)}
.hint{min-height:60px;font-size:28px}
.disp{font-size:56px;font-weight:800;background:var(--cd);border:4px solid var(--b);border-radius:18px;min-height:84px;min-width:140px;display:inline-block;padding:0 24px;margin:6px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:10px auto}
.kp button{min-height:72px;border-radius:20px;background:var(--cd);border:3px solid var(--b);font-size:34px;font-weight:800}
.kp .del{background:var(--o);color:#fff;font-size:22px;border-color:var(--o)}.kp .chk{background:var(--g);color:#fff;font-size:22px;border-color:var(--g)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}.match>div{display:flex;flex-direction:column;gap:12px}
.mc{min-height:76px;border-radius:20px;background:var(--cd);border:4px solid var(--b);font-size:32px;font-weight:800}
.mc.r{border-color:var(--p)}.mc.sel{background:#ffe08a;color:#222}.mc:disabled{opacity:1}
.end{font-size:26px}.stars{font-size:64px;animation:pop .8s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h2{font-size:28px;margin:6px 0 16px}h3{margin:0 0 10px;font-size:22px;text-align:left}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.topic{min-height:150px;border-radius:26px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px;box-shadow:0 6px 0 #0003}
.topic span{font-size:52px}.topic b{font-size:24px;font-weight:800}.topic small{font-size:17px;opacity:.92}
.tb{display:flex;align-items:center;gap:10px;margin:0 0 12px}.tb b{font-size:22px;flex:1;text-align:left}
.back{min-height:52px;padding:6px 16px;border-radius:26px;background:var(--cd);border:3px solid var(--b)}
.nav{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
</style></head><body>
<header><div id="nav"></div><button id="snd" onclick="togg()" aria-label="Âm thanh">🔊</button></header>
<main id="app"></main><div id="pop" onclick="this.classList.remove('show')"><div onclick="event.stopPropagation()" id="pb"></div></div>
<script>
const $=s=>document.querySelector(s),FR=['🍎','🍌','🍓','🍊','🍩','🍪','🍬','🐶','🐱','🧸','⚽'];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
let mute=false,AC;
function tone(f,d,t='sine',v=.15,s=0){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+s;o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
const ting=()=>{tone(880,.25,'sine',.18);tone(1320,.35,'sine',.15,.12)},bip=()=>tone(240,.25,'triangle',.1),win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'sine',.15,i*.12));
function togg(){mute=!mute;$('#snd').textContent=mute?'🔇':'🔊'}
const gen=(max,op)=>{if(op=='mix')op=pick(['add','sub']);let a,b;if(op=='add'){a=rnd(1,max-1);b=rnd(1,max-a)}else{a=rnd(2,max);b=rnd(1,a-1)}return{a,b,op,r:op=='add'?a+b:a-b,e:pick(FR)}};
const sy=o=>o=='add'?'+':'−',rep=(e,n)=>Array(n).fill(`<i class=it>${e}</i>`).join('');
const seg=(o,c,f)=>`<div class=seg>${o.map(([v,l])=>`<button class="pill${v==c?' on':''}" onclick="${f}('${v}')">${l}</button>`).join('')}</div>`;
const R10=[[10,'Phạm vi 10'],[20,'Phạm vi 20']],OPS=[['add','➕ Cộng'],['sub','➖ Trừ']];
function tf(L){let h='';for(let i=0;i<Math.max(1,L.length);i+=10){h+='<div class=tf>';for(let j=i;j<i+10;j++)h+=`<div class=cell>${L[j]||''}</div>`;h+='</div>'}return h}
function scene(op,a,b,e,done){const f='🍊';if(op=='sub'){const L=[];for(let i=0;i<a;i++)L.push(`<i class="it${i>=a-b&&done?' x':''}">${e}</i>`);return`<div class=grp style="flex:1 1 100%">${tf(L)}</div>`}
const k=a<10&&a+b>10?10-a:0,m=done?k:0,A=[],B=[];for(let i=0;i<a+m;i++)A.push(`<i class="it${i>=a?' pop':''}">${i>=a?f:e}</i>`);for(let i=0;i<b-m;i++)B.push(`<i class=it>${f}</i>`);
return`<div class=grp>${tf(A)}</div><div class=plus>+</div><div class=grp>${tf(B)}</div>`}
let tab=0;const TABS=['🔍 Trực quan','📋 Bảng','🎮 Trò chơi','🏆 Thử thách'];
function go(i){tab=i;V.m=T.m=G.m=null;C.st='set';$('#nav').innerHTML=TABS.map((t,j)=>`<button class="tab${j==i?' on':''}" onclick="go(${j})">${t}</button>`).join('');[s1,s2,s3,s4][i]();scrollTo(0,0)}
/* ===== Chung ===== */
const topbar=(t,back)=>`<div class=tb><button class=back onclick="${back}">← Chủ đề</button><b>${t}</b></div>`;
const menu=(title,items,fn)=>`<h2>${title}</h2><div class=topics>${items.map((it,i)=>`<button class="topic c${i%6}" onclick="${fn}(${i})"><span>${it[0]}</span><b>${it[1]}</b><small>${it[2]}</small></button>`).join('')}</div>`;
function exs(op,max){const L=[];if(op=='add'){for(let a=1;a<max;a++)for(let b=1;a+b<=max;b++)if(max==10||(a>1&&b>1&&a<10&&b<10&&a+b>10))L.push([a,b])}else for(let n=2;n<=max;n++)for(let b=1;b<n;b++)if(max==10||(n>10&&b>1&&b<10&&n-b<10))L.push([n,b]);return L}
/* ===== Mục 1 ===== */
const M1=[['➕','Cộng trong 10','Gộp hai nhóm','add',10],['🌟','Cộng qua 10','8 + 5 = 10 + 3','add',20],['➖','Trừ trong 10','Bớt đi','sub',10],['✂️','Trừ qua 10','13 − 5','sub',20]];
let V={m:null,L:[],i:0,done:false,e:'🍎'};
function v1pick(i){V.m=i;V.L=shuf(exs(M1[i][3],M1[i][4]));V.i=0;V.done=false;V.e=pick(FR);s1()}
function v1menu(){V.m=null;s1()}
function v1n(d){V.i=(V.i+d+V.L.length)%V.L.length;V.done=false;V.e=pick(FR);s1()}
function vgo(){V.done=!V.done;s1()}
function s1(){if(V.m==null){$('#app').innerHTML=menu('Chọn bài học',M1,'v1pick');return}
const op=M1[V.m][3],[a,b]=V.L[V.i],done=V.done,k=op=='add'&&a<10&&a+b>10?10-a:0,r=op=='add'?a+b:a-b;
let eq=`${a} ${sy(op)} ${b}`;if(done)eq+=k?` = 10 + ${b-k} = ${r}`:` = ${r}`;
const lb=done?'↺ Làm lại':op=='sub'?'Bớt đi ✂️':k?'Gộp cho đủ 10 ✨':'Gộp lại ➕';
$('#app').innerHTML=topbar(M1[V.m][1],'v1menu()')+`<div class=card2><div class=scene>${scene(op,a,b,V.e,done)}</div><div class=eq>${eq}</div><div class=nav><button class=sb onclick="v1n(-1)">◀</button><button class=btn onclick="vgo()">${lb}</button><button class=sb onclick="v1n(1)">▶</button></div></div>`}
/* ===== Mục 2 ===== */
const M2=[['➕','Bảng cộng 10','Phạm vi 10','add',10],['➖','Bảng trừ 10','Phạm vi 10','sub',10],['🌉','Cộng qua 10','Phạm vi 20','add',20],['🌉','Trừ qua 10','Phạm vi 20','sub',20]];
let T={m:null,cover:false};
function t2pick(i){T.m=i;T.cover=false;s2()}
function s2(){if(T.m==null){$('#app').innerHTML=menu('Chọn bảng',M2,'t2pick');return}
const[,t,,op,max]=M2[T.m],Gp={};exs(op,max).forEach(([a,b])=>(Gp[b]=Gp[b]||[]).push([a,b]));
$('#app').innerHTML=topbar(t,"T.m=null;s2()")+`<button class=btn style="background:var(--o);box-shadow:0 5px 0 #b86d00;margin:0 0 12px" onclick="T.cover=!T.cover;s2()">${T.cover?'👀 Hiện kết quả':'🙈 Che kết quả'}</button>`+Object.keys(Gp).sort((x,y)=>x-y).map(b=>`<div class=card2><h3>${op=='add'?'Cộng':'Trừ'} ${b}</h3><div class=tgrid>${Gp[b].map(([a,b])=>{const r=op=='add'?a+b:a-b;return`<button class="tc c${r%6}" onclick="tpop('${op}',${a},${b})">${a} ${sy(op)} ${b} = ${T.cover?'?':r}</button>`}).join('')}</div></div>`).join('')}
function tpop(op,a,b){const r=op=='add'?a+b:a-b;$('#pb').innerHTML=`<div class=scene>${scene(op,a,b,pick(FR),true)}</div><div class=eq>${a} ${sy(op)} ${b} = ${r}</div><button class=btn onclick="$('#pop').classList.remove('show')">Đóng ✖</button>`;$('#pop').classList.add('show')}
/* ===== Mục 3 ===== */
const M3=[['🍎','Thêm / bớt','Phạm vi 10',1,10],['🍊','Thêm / bớt','Phạm vi 20',1,20],['🔗','Nối cặp','Phạm vi 10',2,10],['🧩','Nối cặp','Phạm vi 20',2,20]];
let G={m:null,max:10,game:1,i:0,sc:0,miss:false},tk=0;
function choices(r,max){const S=new Set([r]);while(S.size<4)S.add(cl(r+rnd(-3,3),0,max));return shuf([...S])}
const stars=(s,n)=>s>=n*.9?3:s>=n*.6?2:1;
function endBox(sc,n,fn){win();return`<div class=card2><div class=stars>${'⭐'.repeat(stars(sc,n))}</div><div class=end>${sc}/${n} ${['','🌱','🥈','🏆'][stars(sc,n)]}</div><button class=btn onclick="${fn}()">Chơi lại 🔄</button></div>`}
function g3pick(i){G.m=i;G.game=M3[i][3];G.max=M3[i][4];G.i=0;G.sc=0;G.miss=false;s3()}
function s3(){if(G.m==null){$('#app').innerHTML=menu('Chọn trò chơi',M3,'g3pick');return}
$('#app').innerHTML=topbar(M3[G.m][1]+' · '+M3[G.m][2],"G.m=null;tk++;s3()")+'<div id=gb></div>';G.game==1?g1():g2()}
function g1r(){G.i=0;G.sc=0;g1()}
function g1(){if(G.i>=5){$('#gb').innerHTML=endBox(G.sc,5,'g1r');return}
const q=gen(G.max,'mix'),my=++tk;G.q=q;
$('#gb').innerHTML=`<div class=prog><i style="width:${G.i*20}%"></i></div><div class="card2"><div class="scene" id=st>${rep(q.e,q.a)}</div><div class=eq>${q.a} ${sy(q.op)} ${q.b} = ?</div></div><div class=ans>${choices(q.r,G.max).map(n=>`<button class=ac onclick="g1p(this,${n})">${n}</button>`).join('')}</div>`;
setTimeout(()=>{if(my!=tk)return;const el=$('#st');if(q.op=='add')el.insertAdjacentHTML('beforeend',Array.from({length:q.b},(_,i)=>`<i class="it fly" style="animation-delay:${i*90}ms">🍊</i>`).join(''));else[...el.children].slice(q.a-q.b).forEach(c=>c.classList.add('x'))},700)}
function g1p(btn,n){if(n==G.q.r){ting();document.querySelectorAll('.ac').forEach(b=>b.disabled=true);btn.classList.add('ok');if(!G.miss)G.sc++;setTimeout(()=>{if(G.m==null)return;G.i++;G.miss=false;g1()},900)}else{bip();btn.disabled=true;btn.classList.add('bad','shake');G.miss=true}}
function g2(){const Q=[],S=new Set();let t=0;while(Q.length<4&&t++<99){const q=gen(G.max,'mix');if(!S.has(q.r)){S.add(q.r);Q.push(q)}}
G.Q=Q;G.sel=null;G.dn=0;
$('#gb').innerHTML=`<div class=match><div>${Q.map((q,i)=>`<button class=mc onclick="g2l(this,${i})">${q.a} ${sy(q.op)} ${q.b}</button>`).join('')}</div><div>${shuf(Q.map(q=>q.r)).map(r=>`<button class="mc r" data-r=${r} onclick="g2r(this)">${r}</button>`).join('')}</div></div><div id=g2e></div>`}
function g2l(b,i){if(b.classList.contains('ok'))return;document.querySelectorAll('.mc:not(.r)').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel=[i,b]}
function g2r(b){if(!G.sel)return;const[i,l]=G.sel;if(+b.dataset.r==G.Q[i].r){ting();[b,l].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true});G.sel=null;if(++G.dn==4){win();$('#g2e').innerHTML='<div class=stars>🎉</div><button class=btn onclick="g2()">Bộ mới 🔄</button>'}}else{bip();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}}
/* ===== Mục 4 ===== */
let C={max:10,op:'add',lv:1,st:'set',i:0,sc:0,Q:[],v:''};
const cset=(k,v)=>{C[k]=k=='op'?v:+v;s4()};
function s4(){if(C.st=='set'){$('#app').innerHTML=seg(R10,C.max,"cset.bind(null,'max')")+seg([['add','➕ Cộng'],['sub','➖ Trừ'],['mix','🔀 Hỗn hợp']],C.op,"cset.bind(null,'op')")+seg([[1,'1️⃣ Chọn đáp án'],[2,'2️⃣ Tự điền số']],C.lv,"cset.bind(null,'lv')")+'<button class=btn onclick="cgo()">Bắt đầu ▶</button>';return}
if(C.i>=10){const s=C.sc;$('#app').innerHTML=endBox(s,10,'cgo')+'<button class=pill onclick="C.st=\'set\';s4()">⚙️ Chọn lại</button>';return}
const q=C.Q[C.i];C.miss=false;C.v='';
$('#app').innerHTML=`<div class=prog><i style="width:${C.i*10}%"></i></div><div class=card2><div class=eq>${q.a} ${sy(q.op)} ${q.b} = <span id=qv>?</span></div><div class=hint id=hn></div><button class=pill onclick="chint()">Trợ giúp 💡</button></div>`+(C.lv==1?`<div class=ans>${choices(q.r,C.max).map(n=>`<button class=ac onclick="cp(this,${n})">${n}</button>`).join('')}</div>`:`<div class=disp id=dp>&nbsp;</div><div class=kp>${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ck(${n})">${n}</button>`).join('')}<button class=del onclick="ck(-1)">Xóa</button><button onclick="ck(0)">0</button><button class=chk onclick="cchk()">Kiểm tra</button></div>`)}
function cgo(){C.Q=[];const S=new Set();let t=0;while(C.Q.length<10&&t++<500){const q=gen(C.max,C.op),k=q.a+q.op+q.b;if(!S.has(k)){S.add(k);C.Q.push(q)}}
C.i=0;C.sc=0;C.st='play';s4()}
function chint(){const q=C.Q[C.i];$('#hn').innerHTML=q.op=='add'?rep(q.e,q.a)+' ➕ '+rep('🍊',q.b):Array.from({length:q.a},(_,i)=>`<i class="it${i>=q.a-q.b?' x':''}">${q.e}</i>`).join('')}
function cnext(){if(!C.miss)C.sc++;setTimeout(()=>{C.i++;s4()},900)}
function cp(b,n){const q=C.Q[C.i];if(n==q.r){ting();document.querySelectorAll('.ac').forEach(x=>x.disabled=true);b.classList.add('ok');$('#qv').textContent=n;cnext()}else{bip();b.disabled=true;b.classList.add('bad','shake');C.miss=true}}
function ck(n){if(n<0)C.v='';else if(C.v.length<2)C.v+=n;$('#dp').innerHTML=C.v||'&nbsp;'}
